[project]
name = "dry-data"
version = "0.1.0"
description = "A data journalism platform exploring alcohol trends through interactive visualizations and natural language queries"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"

dependencies = [
    # Data processing
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.1",

    # Data ingestion
    "pyreadstat>=1.2",         # SAS transport file reader (BRFSS)
    "pytrends>=4.9",           # Google Trends
    "httpx>=0.27",             # HTTP client for API downloads
    "tenacity>=8.2",           # Retry logic

    # LLM integration
    "openai>=1.30",            # OpenAI API client
    "mcp>=1.0",                # MCP SDK for building the server

    # API server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Observability
    "structlog>=24.1",

    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel>=6.29",         # Jupyter support for notebooks
]

[project.scripts]
dry-data = "dry_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dry_data"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catches print() in library code)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "T201",   # allow print in scripts/ directory
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]        # Allow print() in CLI scripts
"tests/*" = ["S101"]          # Allow assert in tests
"notebooks/*" = ["T201", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["dry_data"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests that download real data (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["src/dry_data"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
